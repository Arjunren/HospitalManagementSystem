services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [hospital_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hospital
      DATABASE_USERNAME: hospital
      DATABASE_PASSWORD: hospital
      ALLOWED_ORIGINS: http://localhost:3000
      SPRING_PROFILES_ACTIVE: dev
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  hospital_data: {}

